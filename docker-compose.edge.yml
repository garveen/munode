services:
  edge:
    build:
      context: .
      dockerfile: rust/Dockerfile
      target: edge-runtime
      cache_from:
        - type=local,src=.build-cache/edge
      cache_to:
        - type=local,dest=.build-cache/edge,mode=max
    image: ${MUNODE_EDGE_IMAGE:-munode-edge:latest}
    container_name: munode-edge
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    ports:
      - "${MUMBLE_PORT:-64738}:64738/tcp"
      - "${MUMBLE_PORT:-64738}:64738/udp"
      - "${EDGE_PORT:-64739}:64739/tcp"
      - "${EDGE_PORT:-64739}:64739/udp"
      - "${EDGE_WEB_API_PORT:-8081}:8081"
      # WebTransport (QUIC/HTTP3) — browser clients, requires public TLS cert
      - "${WT_PORT:-64740}:64740/udp"
      # WebSocket fallback — shares port number with WT (UDP vs TCP); put behind TLS
      # reverse proxy for wss:// in production; set ws_fallback_port in edge.toml to
      # override (defaults to network.port + 2 = 64740)
      - "${WT_PORT:-64740}:64740/tcp"
    volumes:
      - ${EDGE_CONFIG:-./config/edge.toml}:/app/config/edge.toml:ro
      - ${LOG_DIR:-./logs}/edge:/app/logs
    secrets:
      - tls_cert
      - tls_key
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - MUNODE_UID=${MUNODE_UID:-1000}
      - MUNODE_GID=${MUNODE_GID:-1000}
    networks:
      - munode-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "64738"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  munode-network:
    driver: bridge

secrets:
  tls_cert:
    file: ${TLS_CERT:-./certs/server.pem}
  tls_key:
    file: ${TLS_KEY:-./certs/server.key}
