syntax = "proto2";

package hubedge;

import "Mumble.proto";

// ============================================================================
// Common Types
// ============================================================================

// ---------------------------------------------------------------------------
// ServerLimitsConfig - Hub 下发给 Edge 的客户端限制配置
// Edge 在向客户端发送 ServerSync / ServerConfig / SuggestConfig 时使用这些值
// ---------------------------------------------------------------------------
message ServerLimitsConfig {
  // 每个客户端的最大带宽（bps）。0 = 无限制。
  optional uint32 max_bandwidth = 1;
  // 文本消息最大长度（字节）。
  optional uint32 text_message_length = 2;
  // 图片消息最大长度（字节）。
  optional uint32 image_message_length = 3;
  // 插件数据消息最大长度（字节）。
  optional uint32 plugin_message_length = 4;
  // 每秒最大文本消息数（令牌桶速率）。0 = 无限制。
  optional float message_rate = 5;
  // 文本消息令牌桶突发大小。
  optional uint32 message_burst = 6;
  // 服务器最大用户数。0 = 无限制。
  optional uint32 max_users = 7;
  // 每频道最大监听者数。0 = 无限制。
  optional uint32 listeners_per_channel = 8;
  // 每用户最大监听频道数。0 = 无限制。
  optional uint32 listeners_per_user = 9;
  // 建议客户端版本（v1 格式：major<<16 | minor<<8 | patch，兼容旧客户端）。
  optional uint32 suggest_version = 10;
  // 建议开启位置音频。
  optional bool suggest_positional = 11;
  // 建议开启按键通话。
  optional bool suggest_push_to_talk = 12;
  // 欢迎消息（MOTD）。
  optional string welcome_text = 13;
  // 建议客户端版本（v2 格式：major<<48 | minor<<32 | patch<<16，供新版客户端使用）。
  optional uint64 suggest_version_v2 = 14;
  // 每频道最大用户数（全局限制）。0 = 无限制。
  optional uint32 max_users_per_channel = 15;
  // 是否允许客户端发送 UDP ping 包（默认 true）。
  optional bool allow_ping = 16;
}

message EdgeInfo {
  required uint32 server_id = 1;
  required string name = 2;
  required string host = 3;
  required uint32 port = 4;
  optional string region = 5;
  required uint32 current_load = 6;
  required uint32 capacity = 7;
  required string certificate = 8;
  required int64 last_seen = 9;
}

// ============================================================================
// RPC 方法参数和结果的类型安全定义
// ============================================================================

// ---------------------------------------------------------------------------
// edge.register - Edge 注册到 Hub
// ---------------------------------------------------------------------------
message EdgeRegisterParams {
  required uint32 server_id = 1;
  required string name = 2;
  required string host = 3;
  required uint32 port = 4;
  optional string region = 5;
  required uint32 capacity = 6;
  required string certificate = 7;
  optional string challenge = 8;
  optional string challenge_response = 9;
}

message EdgeRegisterResult {
  required bool success = 1;
  optional uint32 hub_server_id = 2;
  repeated EdgeInfo edge_list = 3;
  optional string challenge = 4;
  optional uint32 challenge_timeout = 5;
  optional string error = 6;
  // Hub 下发的客户端限制配置，Edge 注册成功后立即生效
  optional ServerLimitsConfig server_limits = 7;
}

// ---------------------------------------------------------------------------
// edge.heartbeat - Edge 发送心跳
// ---------------------------------------------------------------------------
message EdgeHeartbeatParams {
  required uint32 server_id = 1;
  optional EdgeServerStats stats = 2;
}

message EdgeServerStats {
  optional uint32 user_count = 1;
  optional uint32 channel_count = 2;
  optional float cpu_usage = 3;
  optional uint64 memory_usage_mb = 4;
  optional float bandwidth_in = 5;
  optional float bandwidth_out = 6;
}

message EdgeHeartbeatResult {
  required bool success = 1;
  repeated EdgeInfo updated_edges = 2;
  optional string error = 3;
  // 如果 Hub 配置有变更，通过心跳响应推送更新后的限制
  optional ServerLimitsConfig server_limits = 4;
}

// ---------------------------------------------------------------------------
// edge.authenticateUser - Edge 请求用户认证
// ---------------------------------------------------------------------------
message EdgeAuthenticateUserParams {
  required uint32 session_id = 1;
  required uint32 server_id = 2;
  required string username = 3;
  required string password = 4;
  repeated string tokens = 5;
  optional ClientInfo client_info = 6;
  // PreConnect state fields
  optional bool mute = 7;
  optional bool deaf = 8;
  optional bool suppress = 9;
  optional bool self_mute = 10;
  optional bool self_deaf = 11;
  optional bool priority_speaker = 12;
  optional bool recording = 13;
}

message ClientInfo {
  required string ip_address = 1;
  required string ip_version = 2;
  required string release = 3;
  optional uint32 version = 4;
  required string os = 5;
  required string os_version = 6;
  optional string certificate_hash = 7;
}

message EdgeAuthenticateUserResult {
  required bool success = 1;
  optional uint32 user_id = 2;
  optional string username = 3;
  optional string display_name = 4;
  repeated string groups = 5;
  optional string reason = 6;
  optional uint32 reject_type = 7;
  optional uint32 channel_id = 8;
  // Initial user state flags
  optional bool mute = 9;
  optional bool deaf = 10;
  optional bool suppress = 11;
  optional bool self_mute = 12;
  optional bool self_deaf = 13;
  optional bool priority_speaker = 14;
  optional bool recording = 15;
  // Server configuration
  optional bool cert_required = 16;  // Hub 告诉 Edge 是否要求客户端证书
}

message EdgeReportSessionResult {
  required bool success = 1;
  optional string error = 2;
}

// Edge 向 Hub 上报单个会话（重连后补报）
message EdgeReportSessionParams {
  optional GlobalSessionProto session = 1;
}

// ---------------------------------------------------------------------------
// edge.syncVoiceTarget - Edge 同步语音目标配置
// ---------------------------------------------------------------------------
message EdgeSyncVoiceTargetParams {
  required uint32 edge_id = 1;
  required uint32 client_session = 2;
  required uint32 target_id = 3;
  optional VoiceTargetConfigProto config = 4;
}

message VoiceTargetConfigProto {
  repeated VoiceTargetSession sessions = 1;
  repeated VoiceTargetChannel channels = 2;
}

message VoiceTargetSession {
  required uint32 session = 1;
}

message VoiceTargetChannel {
  required uint32 channel_id = 1;
  optional bool children = 2;
  optional bool links = 3;
  optional string group = 4;
}

message EdgeSyncVoiceTargetResult {
  required bool success = 1;
  optional string error = 2;
}

// ---------------------------------------------------------------------------
// edge.getVoiceTargets - Edge 获取语音目标配置
// ---------------------------------------------------------------------------
message EdgeGetVoiceTargetsParams {
  optional uint32 edge_id = 1;
}

message EdgeGetVoiceTargetsResult {
  repeated VoiceTargetConfigEntry voice_targets = 1;
}

message VoiceTargetConfigEntry {
  required uint32 edge_id = 1;
  required uint32 client_session = 2;
  required uint32 target_id = 3;
  optional VoiceTargetConfigProto config = 4;
  required int64 timestamp = 5;
}

// ---------------------------------------------------------------------------
// edge.relayVoiceViaTcp - TCP 降级：Edge 通过 Hub 中转语音数据
// 当 UDP 直连和中转路由都不可用时使用
// ---------------------------------------------------------------------------
message EdgeRelayVoiceViaTcpParams {
  required uint32 from_edge_id = 1;      // 源 Edge ID
  required uint32 target_edge_id = 2;    // 目标 Edge ID
  required bytes voice_packet = 3;       // 完整的语音包（包含 header）
  required int64 timestamp = 4;          // 时间戳
}

message EdgeRelayVoiceViaTcpResult {
  required bool success = 1;
  optional string error = 2;
}

// ---------------------------------------------------------------------------
// edge.adminOperation - Edge 执行管理操作
// ---------------------------------------------------------------------------
message EdgeAdminOperationParams {
  required string operation = 1;
  optional bytes data = 2;
}

message EdgeAdminOperationResult {
  required bool success = 1;
  optional string message = 2;
  optional AdminStats stats = 3;
}

message AdminStats {
  optional uint32 edges = 1;
  optional uint32 sessions = 2;
  optional uint32 voice_targets = 3;
  optional uint32 channels = 4;
}

// ---------------------------------------------------------------------------
// edge.exchangeCertificates - Edge 交换证书
// ---------------------------------------------------------------------------
message EdgeExchangeCertificatesParams {
  required uint32 server_id = 1;
  required string certificate = 2;
}

message EdgeExchangeCertificatesResult {
  required bool success = 1;
  optional string error = 2;
}

// ---------------------------------------------------------------------------
// edge.fullSync - Edge 请求完整同步
// ---------------------------------------------------------------------------
message EdgeFullSyncParams {
  optional uint32 for_user_id = 1;
  repeated string for_user_groups = 2;
  optional uint32 for_user_channel_id = 3;
  optional string for_user_cert_hash = 4;
}

message EdgeFullSyncResult {
  repeated ChannelDataProto channels = 1;
  repeated ChannelLinkProto channel_links = 2;
  repeated ACLDataProto acls = 3;
  repeated BanDataProto bans = 4;
  repeated GlobalSessionProto sessions = 5;
  required int64 timestamp = 6;
  required uint64 sequence = 7;
  repeated EdgeInfoProto edges = 8;
  // True when the Hub's session table was empty at the time of this sync.
  // This is a reliable proxy for "Hub just restarted cold" — a client-less
  // cluster would also set this flag, but in that case old_session_ids is
  // also empty so no UserRemove fan-out would have happened anyway.
  // The Edge uses this to defer the UserRemove broadcast by a grace period
  // so that peer Edges have time to re-register and re-report their sessions,
  // preventing a spurious "all remote users disappeared" flash after Hub restart.
  optional bool hub_was_empty = 9;
}

message ChannelDataProto {
  required uint32 channel_id = 1;
  required string name = 2;
  optional uint32 parent_id = 3;
  optional string description = 4;
  optional int32 position = 5;
  optional uint32 max_users = 6;
  optional bool temporary = 7;
  optional bool inherit_acl = 8;
  repeated uint32 links = 9;
}

message ChannelLinkProto {
  required uint32 channel_id = 1;
  required uint32 target_id = 2;
}

message ACLDataProto {
  optional uint32 id = 1;
  required uint32 channel_id = 2;
  optional uint32 user_id = 3;
  optional string group = 4;
  required bool apply_here = 5;
  required bool apply_subs = 6;
  required uint32 allow = 7;
  required uint32 deny = 8;
}

message BanDataProto {
  required string address = 1;
  required uint32 mask = 2;
  optional string username = 3;
  optional string cert_hash = 4;
  optional string reason = 5;
  optional int64 start = 6;
  optional uint32 duration = 7;
}

message GlobalSessionProto {
  required uint32 session_id = 1;
  required uint32 edge_id = 2;
  required uint32 user_id = 3;
  required string username = 4;
  required uint32 channel_id = 5;
  optional string ip_address = 6;
  optional string cert_hash = 7;
  optional int64 connected_at = 8;
  repeated string groups = 9;
  // User state fields
  optional bool mute = 10;
  optional bool deaf = 11;
  optional bool suppress = 12;
  optional bool self_mute = 13;
  optional bool self_deaf = 14;
  optional bool priority_speaker = 15;
  optional bool recording = 16;
  // Channel listener state
  repeated uint32 listening_channels = 17;
}

message EdgeInfoProto {
  required uint32 server_id = 1;
  required string name = 2;
  required string host = 3;
  required uint32 port = 4;
  optional string region = 5;
  required uint32 current_load = 6;
  required uint32 capacity = 7;
}

// ---------------------------------------------------------------------------
// edge.getChannels - Edge 获取频道列表
// ---------------------------------------------------------------------------
message EdgeGetChannelsParams {
  // Empty params
}

message EdgeGetChannelsResult {
  repeated ChannelDataProto channels = 1;
}

// ---------------------------------------------------------------------------
// edge.getACLs - Edge 获取 ACL 列表
// ---------------------------------------------------------------------------
message EdgeGetACLsParams {
  required uint32 channel_id = 1;
}

message EdgeGetACLsResult {
  repeated ACLDataProto acls = 1;
}

// ---------------------------------------------------------------------------
// edge.saveChannel - Edge 保存频道
// ---------------------------------------------------------------------------
message EdgeSaveChannelParams {
  optional uint32 id = 1;
  optional string name = 2;
  optional int32 position = 3;
  optional uint32 max_users = 4;
  optional uint32 parent_id = 5;
  optional bool inherit_acl = 6;
  optional string description = 7;
  optional string description_blob = 8;
  optional bool temporary = 9;
  optional uint32 creator_session = 10;
}

message EdgeSaveChannelResult {
  required bool success = 1;
  optional uint32 channel_id = 2;
  optional string error = 3;
}

// ---------------------------------------------------------------------------
// edge.saveACL - Edge 保存 ACL
// ---------------------------------------------------------------------------
message EdgeSaveACLParams {
  required uint32 channel_id = 1;
  repeated ACLEntryProto acls = 2;
}

message ACLEntryProto {
  optional uint32 id = 1;
  optional uint32 channel_id = 2;
  optional uint32 user_id = 3;
  optional string group = 4;
  required bool apply_here = 5;
  required bool apply_subs = 6;
  required uint32 allow = 7;
  required uint32 deny = 8;
}

message EdgeSaveACLResult {
  required bool success = 1;
  repeated uint32 acl_ids = 2;
  optional string error = 3;
}

// ---------------------------------------------------------------------------
// edge.join - Edge 请求加入集群
// ---------------------------------------------------------------------------
message EdgeJoinParams {
  required uint32 server_id = 1;
  required string name = 2;
  required string host = 3;
  required uint32 port = 4;
  required uint32 voice_port = 5;
  required uint32 capacity = 6;
}

message EdgeJoinResult {
  required bool success = 1;
  optional string token = 2;
  repeated PeerInfoProto peers = 3;
  optional uint32 timeout = 4;
  optional string error = 5;
}

message PeerInfoProto {
  required uint32 id = 1;
  required string name = 2;
  required string host = 3;
  required uint32 port = 4;
  required uint32 voice_port = 5;
  optional string cert_hash = 6;
}

// ---------------------------------------------------------------------------
// edge.joinComplete - Edge 完成集群加入
// ---------------------------------------------------------------------------
message EdgeJoinCompleteParams {
  required uint32 server_id = 1;
  required string token = 2;
  repeated uint32 connected_peers = 3;
}

message EdgeJoinCompleteResult {
  required bool success = 1;
  optional string error = 2;
}

// ---------------------------------------------------------------------------
// edge.handleACL - Edge 处理 ACL 消息
// ---------------------------------------------------------------------------
message EdgeHandleACLParams {
  required uint32 edge_id = 1;
  required uint32 actor_session = 2;
  required uint32 actor_user_id = 3;
  required string actor_username = 4;
  required uint32 channel_id = 5;
  required bool query = 6;
  required bytes raw_data = 7;
}

message EdgeHandleACLResult {
  required bool success = 1;
  optional string error = 2;
  optional bool permission_denied = 3;
  optional uint32 channel_id = 4;
  optional bytes raw_data = 5;
}

// ---------------------------------------------------------------------------
// edge.handlePermissionQuery - Edge 处理 PermissionQuery 消息
// ---------------------------------------------------------------------------
message EdgeHandlePermissionQueryParams {
  required uint32 edge_id = 1;
  required uint32 actor_session = 2;
  required uint32 actor_user_id = 3;
  required string actor_username = 4;
  required uint32 channel_id = 5;
}

message EdgeHandlePermissionQueryResult {
  required bool success = 1;
  optional uint32 permissions = 2;
  optional string error = 3;
}

// ---------------------------------------------------------------------------
// edge.saveChannelListeners - persist user channel listeners on disconnect
// ---------------------------------------------------------------------------
message EdgeSaveChannelListenersParams {
  // The registered user_id whose listening channels should be saved.
  // 0 means "guest/anonymous" (no-op — guests have no persistent state).
  required uint32 user_id = 1;
  // The channel IDs the user was listening to at disconnect.
  repeated uint32 channel_ids = 2;
}

message EdgeSaveChannelListenersResult {
  required bool success = 1;
  optional string error = 2;
}

// ---------------------------------------------------------------------------
// edge.loadChannelListeners - load user channel listeners on connect
// ---------------------------------------------------------------------------
message EdgeLoadChannelListenersParams {
  // The registered user_id whose listening channels should be loaded.
  required uint32 user_id = 1;
}

message EdgeLoadChannelListenersResult {
  required bool success = 1;
  // The channel IDs the user was listening to at their last disconnect.
  repeated uint32 channel_ids = 2;
  optional string error = 3;
}

// ---------------------------------------------------------------------------
// edge.batchPermissionQuery - Edge 批量查询多个频道的权限（用于登录序列）
// ---------------------------------------------------------------------------
message EdgeBatchPermissionQueryParams {
  required uint32 edge_id = 1;
  required uint32 actor_session = 2;
  required uint32 actor_user_id = 3;
  required string actor_username = 4;
  // Channel IDs to query permissions for
  repeated uint32 channel_ids = 5;
}

// Per-channel result entry
message ChannelPermissionEntry {
  required uint32 channel_id = 1;
  required uint32 permissions = 2;
  // Whether the channel itself has any ACL entry denying Enter (channel property,
  // independent of the querying user's own permissions). Matches Murmur's
  // isChannelEnterRestricted() behaviour. Used to populate the Mumble
  // ChannelState.is_enter_restricted field shown as a lock icon in the client.
  optional bool is_enter_restricted = 3;
}

message EdgeBatchPermissionQueryResult {
  required bool success = 1;
  // One entry per requested channel_id, in the same order
  repeated ChannelPermissionEntry entries = 2;
  optional string error = 3;
}

// ---------------------------------------------------------------------------
// edge.reportPeerDisconnect - Edge 报告 Peer 断开连接
// ---------------------------------------------------------------------------
message EdgeReportPeerDisconnectParams {
  required uint32 local_edge_id = 1;
  required uint32 remote_edge_id = 2;
  required uint32 local_client_count = 3;
}

message EdgeReportPeerDisconnectResult {
  required string action = 1;
}

// ---------------------------------------------------------------------------
// edge.reportQuality - Edge 上报网络质量
// ---------------------------------------------------------------------------
message EdgeReportQualityParams {
  required uint32 edge_id = 1;
  required uint32 target_edge_id = 2;
  required NetworkQualityProto quality = 3;
}

message NetworkQualityProto {
  required float rtt = 1;
  required float packet_loss = 2;
  required float jitter = 3;
  required uint32 samples = 4;
}

message EdgeReportQualityResult {
  required bool success = 1;
}

// ---------------------------------------------------------------------------
// cluster.getStatus - 获取集群状态
// ---------------------------------------------------------------------------
message ClusterGetStatusParams {
  // Empty params
}

message ClusterGetStatusResult {
  repeated ClusterEdgeStatusProto edges = 1;
}

message ClusterEdgeStatusProto {
  required uint32 id = 1;
  required string name = 2;
  required string host = 3;
  required uint32 port = 4;
  required uint32 client_count = 5;
  required string status = 6;
  optional int64 last_seen = 7;
}

// ---------------------------------------------------------------------------
// blob.put - 存储 Blob 数据
// ---------------------------------------------------------------------------
message BlobPutParams {
  required bytes data = 1;
}

message BlobPutResult {
  required bool success = 1;
  optional string hash = 2;
  optional string error = 3;
}

// ---------------------------------------------------------------------------
// blob.get - 获取 Blob 数据
// ---------------------------------------------------------------------------
message BlobGetParams {
  required string hash = 1;
}

message BlobGetResult {
  required bool success = 1;
  optional bytes data = 2;
  optional string error = 3;
}

// ---------------------------------------------------------------------------
// blob.getUserTexture - 获取用户纹理
// ---------------------------------------------------------------------------
message BlobGetUserTextureParams {
  required uint32 user_id = 1;
}

message BlobGetUserTextureResult {
  required bool success = 1;
  optional bytes data = 2;
  optional string hash = 3;
  optional string error = 4;
}

// ---------------------------------------------------------------------------
// blob.getUserComment - 获取用户评论
// ---------------------------------------------------------------------------
message BlobGetUserCommentParams {
  required uint32 user_id = 1;
}

message BlobGetUserCommentResult {
  required bool success = 1;
  optional bytes data = 2;
  optional string hash = 3;
  optional string error = 4;
}

// ---------------------------------------------------------------------------
// blob.setUserTexture - 设置用户纹理
// ---------------------------------------------------------------------------
message BlobSetUserTextureParams {
  required uint32 user_id = 1;
  required bytes data = 2;
}

message BlobSetUserTextureResult {
  required bool success = 1;
  optional string hash = 2;
  optional string error = 3;
}

// ---------------------------------------------------------------------------
// blob.setUserComment - 设置用户评论
// ---------------------------------------------------------------------------
message BlobSetUserCommentParams {
  required uint32 user_id = 1;
  required bytes data = 2;
}

message BlobSetUserCommentResult {
  required bool success = 1;
  optional string hash = 2;
  optional string error = 3;
}

// ============================================================================
// Hub -> Edge 通知消息
// ============================================================================

// ---------------------------------------------------------------------------
// voice.data - Hub 通知 Edge 有语音数据
// ---------------------------------------------------------------------------
message HubVoiceDataParams {
  required uint32 from_session_id = 1;
  required uint32 target_session_id = 2;
  required bytes voice_data = 3;
  required int64 timestamp = 4;
}

// ---------------------------------------------------------------------------
// edge.forceDisconnect - Hub 通知 Edge 强制断开连接
// ---------------------------------------------------------------------------
message HubForceDisconnectParams {
  required string reason = 1;
}

// ---------------------------------------------------------------------------
// edge.peerJoined - Hub 通知 Edge 有新成员加入
// ---------------------------------------------------------------------------
message HubPeerJoinedParams {
  required uint32 id = 1;
  required string name = 2;
  required string host = 3;
  required uint32 port = 4;
  required uint32 voice_port = 5;
  optional string cert_hash = 6;
}

// ---------------------------------------------------------------------------
// hub.aclResponse - Hub 向 Edge 返回 ACL 查询结果
// ---------------------------------------------------------------------------
message HubACLResponseParams {
  required uint32 edge_id = 1;
  required uint32 actor_session = 2;
  required bool success = 3;
  optional uint32 channel_id = 4;
  optional bytes raw_data = 5;
  optional string error = 6;
  optional bool permission_denied = 7;
}

// ---------------------------------------------------------------------------
// hub.relayVoicePacket - Hub 转发语音包给 Edge (TCP降级)
// ---------------------------------------------------------------------------
message HubRelayVoicePacketParams {
  required uint32 from_edge_id = 1;
  required bytes voice_packet = 2;
  required int64 timestamp = 3;
}

// ---------------------------------------------------------------------------
// hub.userJoined - Hub 通知 Edge 有用户加入
// ---------------------------------------------------------------------------
message HubUserJoinedParams {
  required uint32 session_id = 1;
  required uint32 edge_id = 2;
  required uint32 user_id = 3;
  required string username = 4;
  required uint32 channel_id = 5;
  repeated string groups = 6;
  optional string cert_hash = 7;
  // User state fields
  optional bool mute = 8;
  optional bool deaf = 9;
  optional bool suppress = 10;
  optional bool self_mute = 11;
  optional bool self_deaf = 12;
  optional bool priority_speaker = 13;
  optional bool recording = 14;
  // Listening channels (channel listener feature)
  repeated uint32 listening_channels = 15;
}

// ---------------------------------------------------------------------------
// hub.userRemoveBroadcast - Hub 通知 Edge 用户移除/离开
// 统一处理用户移除(kick/ban)和普通离开两种场景：
// - 如果有actor，表示是kick/ban操作
// - 如果没有actor，表示是普通的用户离开
// ---------------------------------------------------------------------------
message HubUserRemoveBroadcastParams {
  required uint32 session = 1;
  optional uint32 actor = 2;        // 如果是kick/ban，这是操作者的session
  optional string reason = 3;
  optional bool ban = 4;
  repeated uint32 target_sessions = 5; // Channel Ninja模式：只发送给这些session
}

// ---------------------------------------------------------------------------
// hub.userMoved - Hub 通知 Edge 用户移动频道
// ---------------------------------------------------------------------------
message HubUserMovedParams {
  required uint32 session_id = 1;
  required uint32 edge_id = 2;
  required uint32 channel_id = 3;
  optional uint32 actor_session = 4;
}

// ---------------------------------------------------------------------------
// hub.channelCreated - Hub 通知 Edge 频道创建
// ---------------------------------------------------------------------------
message HubChannelCreatedParams {
  required ChannelDataProto channel = 1;
}

// ---------------------------------------------------------------------------
// hub.channelRemoved - Hub 通知 Edge 频道删除
// ---------------------------------------------------------------------------
message HubChannelRemovedParams {
  required uint32 channel_id = 1;
}

// ---------------------------------------------------------------------------
// hub.channelUpdated - Hub 通知 Edge 频道更新
// ---------------------------------------------------------------------------
message HubChannelUpdatedParams {
  required ChannelDataProto channel = 1;
}

// ---------------------------------------------------------------------------
// hub.syncVoiceTarget - Hub 同步 Voice Target 配置到其他 Edge
// ---------------------------------------------------------------------------
message HubSyncVoiceTargetParams {
  required uint32 edge_id = 1;
  required uint32 client_session = 2;
  required uint32 target_id = 3;
  optional VoiceTargetConfigProto config = 4;  // VoiceTarget config (typed)
  required int64 timestamp = 5;
}

// ---------------------------------------------------------------------------
// Edge → Hub 通知消息 (替代 unknown_params_json)
// ---------------------------------------------------------------------------
message EdgeHandleUserLeftParams {
  required uint32 session_id = 1;
  required uint32 edge_id = 2;
  optional string reason = 3;
}

// ---------------------------------------------------------------------------
// Edge → Hub RPC 结果 (用户/频道状态变更的 RPC 应答)
// ---------------------------------------------------------------------------
message EdgeUserLeftResult {
  required bool success = 1;
  optional string error = 2;
}
message EdgeUserMovedResult {
  required bool success = 1;
  optional string error = 2;
}
message EdgeUserStateChangedResult {
  required bool success = 1;
  optional string error = 2;
}
message EdgeChannelStateResult {
  required bool success = 1;
  optional string error = 2;
}
message EdgeChannelRemoveResult {
  required bool success = 1;
  optional string error = 2;
}
message EdgeUserRemoveResult {
  required bool success = 1;
  optional string error = 2;
}

message EdgeHandleUserRemoveParams {
  required uint32 edge_id = 1;
  required uint32 actor_session = 2;
  required uint32 actor_user_id = 3;
  required string actor_username = 4;
  required uint32 target_session = 5;
  required string reason = 6;
  required bool ban = 7;
}

message EdgeHandleUserMovedParams {
  required uint32 session_id = 1;
  required uint32 edge_id = 2;
  required uint32 channel_id = 3;
  optional uint32 actor_session = 4;
}

message EdgeHandleUserStateChangedParams {
  required uint32 session_id = 1;
  required uint32 edge_id = 2;
  optional bool self_mute = 3;
  optional bool self_deaf = 4;
  optional bool mute = 5;
  optional bool deaf = 6;
  optional bool suppress = 7;
  optional bool priority_speaker = 8;
  optional bool recording = 9;
  repeated uint32 listening_channel_add = 10;
  repeated uint32 listening_channel_remove = 11;
  optional uint32 actor_session = 12;
}

message EdgeHandleTextMessageParams {
  required uint32 actor = 1;
  required uint32 edge_id = 2;
  required string message = 3;
  repeated uint32 channel_id = 4;
  repeated uint32 tree_id = 5;
  repeated uint32 session = 6;
}

message EdgeHandleChannelStateParams {
  required uint32 edge_id = 1;
  required uint32 channel_id = 2;
  repeated uint32 links_add = 3;
  repeated uint32 links_remove = 4;
  optional string name = 5;
  optional string description = 6;
  optional int32 position = 7;
  optional uint32 parent_id = 8;
}

message EdgeHandleChannelRemoveParams {
  required uint32 edge_id = 1;
  required uint32 channel_id = 2;
}

// ---------------------------------------------------------------------------
// Hub → Edge 广播消息 (替代 unknown_params_json)
// ---------------------------------------------------------------------------
message HubUserStateBroadcastParams {
  required uint32 session_id = 1;
  required uint32 edge_id = 2;
  optional bool self_mute = 3;
  optional bool self_deaf = 4;
  optional bool mute = 5;
  optional bool deaf = 6;
  optional bool suppress = 7;
  optional bool priority_speaker = 8;
  optional bool recording = 9;
  repeated uint32 listening_channel_add = 10;
  repeated uint32 listening_channel_remove = 11;
  optional uint32 actor_session = 12;
}

message HubTextMessageForwardParams {
  required uint32 actor = 1;
  required string message = 2;
  repeated uint32 channel_id = 3;
  repeated uint32 tree_id = 4;
  repeated uint32 session = 5;
}

message HubClusterPeerJoinedParams {
  required uint32 edge_id = 1;
  required string name = 2;
  required string host = 3;
  required uint32 voice_port = 4;
}

message HubClusterPeerLeftParams {
  required uint32 edge_id = 1;
}

// ---------------------------------------------------------------------------
// hub.pluginDataBroadcast - Hub 广播插件数据到 Edge
// ---------------------------------------------------------------------------
message HubPluginDataBroadcastParams {
  required uint32 sender_session = 1;
  required string dataID = 2;
  required bytes data = 3;
  repeated uint32 target_sessions = 4;
}

// ---------------------------------------------------------------------------
// edge.pluginDataTransmission - Edge 通知 Hub 插件数据传输
// ---------------------------------------------------------------------------
message EdgePluginDataTransmissionParams {
  required uint32 edge_id = 1;
  required uint32 actor_session = 2;
  required string actor_username = 3;
  required uint32 sender_session = 4;
  required string dataID = 5;
  required bytes data = 6;
  repeated uint32 receiver_sessions = 7;
}

// ============================================================================
// 类型安全的 RPC 请求/响应包装
// ============================================================================

/**
 * TypedRPCRequest - 类型安全的 RPC 请求
 * 使用 method 字段标识方法，params 字段根据方法类型选择
 */
message TypedRPCRequest {
  required string request_id = 1;
  required string method = 2;
  optional uint32 timeout_ms = 3;
  
  // 根据 method 选择对应的 params
  optional EdgeRegisterParams edge_register = 10;
  optional EdgeHeartbeatParams edge_heartbeat = 11;
  optional EdgeAuthenticateUserParams edge_authenticate_user = 13;
  optional EdgeSyncVoiceTargetParams edge_sync_voice_target = 15;
  optional EdgeGetVoiceTargetsParams edge_get_voice_targets = 16;
  optional EdgeRelayVoiceViaTcpParams edge_relay_voice_via_tcp = 17;
  optional EdgeAdminOperationParams edge_admin_operation = 18;
  optional EdgeExchangeCertificatesParams edge_exchange_certificates = 19;
  optional EdgeFullSyncParams edge_full_sync = 20;
  optional EdgeGetChannelsParams edge_get_channels = 21;
  optional EdgeGetACLsParams edge_get_acls = 22;
  optional EdgeSaveChannelParams edge_save_channel = 23;
  optional EdgeSaveACLParams edge_save_acl = 24;
  optional EdgeJoinParams edge_join = 25;
  optional EdgeJoinCompleteParams edge_join_complete = 26;
  optional EdgeHandleACLParams edge_handle_acl = 27;
  optional EdgeHandlePermissionQueryParams edge_handle_permission_query = 28;
  optional EdgeReportPeerDisconnectParams edge_report_peer_disconnect = 29;
  optional EdgeReportQualityParams edge_report_quality = 30;
  optional ClusterGetStatusParams cluster_get_status = 31;
  optional BlobPutParams blob_put = 32;
  optional BlobGetParams blob_get = 33;
  optional BlobGetUserTextureParams blob_get_user_texture = 34;
  optional BlobGetUserCommentParams blob_get_user_comment = 35;
  optional BlobSetUserTextureParams blob_set_user_texture = 36;
  optional BlobSetUserCommentParams blob_set_user_comment = 37;
  // edge.saveChannelListeners - persist user channel listeners on disconnect
  optional EdgeSaveChannelListenersParams edge_save_channel_listeners = 38;
  // edge.loadChannelListeners - load user channel listeners on connect
  optional EdgeLoadChannelListenersParams edge_load_channel_listeners = 39;
  optional EdgeBatchPermissionQueryParams edge_batch_permission_query = 40;
  // edge.reportSession — re-report a live session after reconnect
  optional EdgeReportSessionParams edge_report_session = 14;

  // ---------------------------------------------------------------------------
  // State-mutation RPCs (replaces fire-and-forget notifications)
  // ---------------------------------------------------------------------------
  optional EdgeHandleUserLeftParams    edge_user_left            = 41;
  optional EdgeHandleUserMovedParams   edge_user_moved           = 42;
  optional EdgeHandleUserStateChangedParams edge_user_state_changed = 43;
  optional EdgeHandleChannelStateParams     edge_channel_state      = 44;
  optional EdgeHandleChannelRemoveParams    edge_channel_remove     = 45;
  optional EdgeHandleUserRemoveParams  edge_user_remove          = 46;
}

/**
 * TypedRPCResponse - 类型安全的 RPC 响应
 * 使用 method 字段标识方法，result 字段根据方法类型选择
 */
message TypedRPCResponse {
  required string request_id = 1;
  optional string method = 2;
  optional uint32 processing_time_ms = 3;
  
  // 根据 method 选择对应的 result
  optional EdgeRegisterResult edge_register = 10;
  optional EdgeHeartbeatResult edge_heartbeat = 11;
  optional EdgeAuthenticateUserResult edge_authenticate_user = 13;
  optional EdgeReportSessionResult edge_report_session = 14;
  optional EdgeSyncVoiceTargetResult edge_sync_voice_target = 15;
  optional EdgeGetVoiceTargetsResult edge_get_voice_targets = 16;
  optional EdgeRelayVoiceViaTcpResult edge_relay_voice_via_tcp = 17;
  optional EdgeAdminOperationResult edge_admin_operation = 18;
  optional EdgeExchangeCertificatesResult edge_exchange_certificates = 19;
  optional EdgeFullSyncResult edge_full_sync = 20;
  optional EdgeGetChannelsResult edge_get_channels = 21;
  optional EdgeGetACLsResult edge_get_acls = 22;
  optional EdgeSaveChannelResult edge_save_channel = 23;
  optional EdgeSaveACLResult edge_save_acl = 24;
  optional EdgeJoinResult edge_join = 25;
  optional EdgeJoinCompleteResult edge_join_complete = 26;
  optional EdgeHandleACLResult edge_handle_acl = 27;
  optional EdgeHandlePermissionQueryResult edge_handle_permission_query = 28;
  optional EdgeReportPeerDisconnectResult edge_report_peer_disconnect = 29;
  optional EdgeReportQualityResult edge_report_quality = 30;
  optional ClusterGetStatusResult cluster_get_status = 31;
  optional BlobPutResult blob_put = 32;
  optional BlobGetResult blob_get = 33;
  optional BlobGetUserTextureResult blob_get_user_texture = 34;
  optional BlobGetUserCommentResult blob_get_user_comment = 35;
  optional BlobSetUserTextureResult blob_set_user_texture = 36;
  optional BlobSetUserCommentResult blob_set_user_comment = 37;
  // edge.saveChannelListeners result
  optional EdgeSaveChannelListenersResult edge_save_channel_listeners = 38;
  // edge.loadChannelListeners result
  optional EdgeLoadChannelListenersResult edge_load_channel_listeners = 39;
  optional EdgeBatchPermissionQueryResult edge_batch_permission_query = 40;

  // State-mutation RPC results
  optional EdgeUserLeftResult          edge_user_left            = 41;
  optional EdgeUserMovedResult         edge_user_moved           = 42;
  optional EdgeUserStateChangedResult  edge_user_state_changed   = 43;
  optional EdgeChannelStateResult      edge_channel_state        = 44;
  optional EdgeChannelRemoveResult     edge_channel_remove       = 45;
  optional EdgeUserRemoveResult        edge_user_remove          = 46;
}
message HubRouteEntryProto {
  required uint32 target_edge_id = 1;
  required uint32 route_type = 2;    // 0=DirectUdp, 1=RelayChain, 2=HubTcp, 3=DirectTcp
  repeated uint32 relay_chain = 3;   // full relay chain (intermediate edges, excl. src+dst)
  repeated uint32 relay_transports = 4; // transport per hop: 0=UDP, 1=TCP
  required float cost = 5;
}

message HubRouteTableUpdateParams {
  repeated HubRouteEntryProto routes = 1;
  optional uint32 max_ttl = 2;  // cluster-wide TTL cap for relay packets
}

/**
 * TypedRPCNotification - 类型安全的 RPC 通知
 */
message TypedRPCNotification {
  required string method = 1;
  optional int64 timestamp = 2;
  
  // 根据 method 选择对应的 params
  optional HubVoiceDataParams voice_data = 10;
  optional HubForceDisconnectParams force_disconnect = 11;
  optional HubPeerJoinedParams peer_joined = 12;
  optional HubACLResponseParams acl_response = 13;
  optional HubUserJoinedParams user_joined = 14;
  optional HubUserRemoveBroadcastParams user_remove_broadcast = 15;
  optional HubUserMovedParams user_moved = 16;
  optional HubChannelCreatedParams channel_created = 17;
  optional HubChannelRemovedParams channel_removed = 18;
  optional HubChannelUpdatedParams channel_updated = 19;
  optional HubSyncVoiceTargetParams sync_voice_target = 20;
  optional HubPluginDataBroadcastParams plugin_data_broadcast = 21;
  optional EdgePluginDataTransmissionParams plugin_data_transmission = 22;
  optional HubRelayVoicePacketParams relay_voice_packet = 23;
  // Typed replacements for unknown_params_json
  optional EdgeHandleUserLeftParams handle_user_left = 24;
  optional EdgeHandleUserRemoveParams handle_user_remove = 25;
  optional EdgeHandleUserMovedParams handle_user_moved = 26;
  optional EdgeHandleUserStateChangedParams handle_user_state_changed = 27;
  optional EdgeHandleTextMessageParams handle_text_message = 28;
  optional EdgeHandleChannelStateParams handle_channel_state = 29;
  optional EdgeHandleChannelRemoveParams handle_channel_remove = 30;
  optional HubUserStateBroadcastParams user_state_broadcast = 31;
  optional HubTextMessageForwardParams text_message_forward = 32;
  optional HubClusterPeerJoinedParams cluster_peer_joined = 33;
  optional HubClusterPeerLeftParams cluster_peer_left = 34;
  optional HubRouteTableUpdateParams route_table_update = 36;
  // Hub → Edge: 热重载后将最新服务器限制配置推送给所有 Edge
  optional ServerLimitsConfig server_config_update = 38;
  // hub.contextAction — forward a Mumble ContextAction from an Edge
  optional EdgeContextActionParams context_action = 35;
  // hub.contextActionModify — Hub pushes ContextActionModify to targeted clients
  optional HubContextActionModifyParams context_action_modify = 37;

  // For unknown notification types, store params as JSON string
  optional string unknown_params_json = 99;
}

// ---------------------------------------------------------------------------
// hub.contextAction notification params
// ---------------------------------------------------------------------------
message EdgeContextActionParams {
  required uint32                        edge_id    = 1;
  required uint32                        session_id = 2;
  optional mumbleproto.ContextAction     action     = 3;
}

// ---------------------------------------------------------------------------
// hub.contextActionModify — Hub forwards ContextActionModify to targeted clients
// ---------------------------------------------------------------------------
message HubContextActionModifyParams {
  optional mumbleproto.ContextActionModify action          = 1;
  repeated uint32                           target_sessions = 2;
}
