syntax = "proto2";

package authservice;

// ============================================================================
// AuthService 协议 - Hub 与外部认证服务之间的通信协议
//
// 工作流程:
//   1. 认证服务启动并通过 WebSocket 连接到 Hub 的认证服务端口
//   2. 认证服务发送 HELLO 包自我介绍
//   3. 当 Mumble 客户端连接并认证时, Hub 向认证服务发送 AUTH_REQUEST
//   4. 认证服务调用用户配置的 callback 处理请求, 返回 AUTH_RESPONSE
//   5. Hub 根据响应允许或拒绝客户端连接
// ============================================================================

// 主数据包包装器 - 所有消息均通过此结构传输
message AuthServicePacket {
  enum Type {
    UNKNOWN = 0;
    AUTH_REQUEST = 1;    // Hub -> 认证服务: 请求认证
    AUTH_RESPONSE = 2;   // 认证服务 -> Hub: 认证结果
    PING = 3;            // 心跳请求
    PONG = 4;            // 心跳响应
    HELLO = 5;           // 认证服务 -> Hub: 自我介绍
  }

  required Type type = 1;
  optional AuthRequest auth_request = 2;
  optional AuthResponse auth_response = 3;
  optional HelloParams hello = 5;
}

// ---------------------------------------------------------------------------
// HELLO - 认证服务连接后发送, 自我介绍
// ---------------------------------------------------------------------------
message HelloParams {
  required string service_name = 1;  // 服务名称
  optional string version = 2;       // 服务版本
}

// ---------------------------------------------------------------------------
// AuthRequest - Hub -> 认证服务
// 当 Mumble 客户端尝试连接时触发
// ---------------------------------------------------------------------------
message AuthRequest {
  required string request_id = 1;        // 唯一请求 ID, 用于匹配响应
  required string username = 2;          // 用户名
  required string password = 3;          // 密码
  repeated string tokens = 4;            // 访问令牌列表
  required uint32 session_id = 5;        // 客户端会话 ID
  required uint32 server_id = 6;         // Edge 服务器 ID
  required string ip_address = 7;        // 客户端 IP 地址
  required string ip_version = 8;        // IP 版本 ("IPv4" 或 "IPv6")
  required string release = 9;           // Mumble 客户端版本字符串
  optional uint32 version = 10;          // 客户端版本号
  required string os = 11;               // 客户端操作系统
  required string os_version = 12;       // 客户端操作系统版本
  optional string certificate_hash = 13; // TLS 客户端证书哈希 (如有)
}

// ---------------------------------------------------------------------------
// AuthResponse - 认证服务 -> Hub
// 认证服务处理后返回认证结果
// ---------------------------------------------------------------------------
message AuthResponse {
  required string request_id = 1;    // 对应的请求 ID
  required bool success = 2;         // 是否认证成功

  // 认证成功时的用户信息
  optional uint32 user_id = 3;       // 用户 ID (0 表示访客)
  optional string username = 4;      // 规范化用户名 (可与请求中不同)
  optional string display_name = 5;  // 显示名称
  repeated string groups = 6;        // 用户所属的组

  // 认证失败时的信息
  optional string reason = 7;        // 拒绝原因消息

  // Mumble 拒绝类型枚举:
  //   1 = InvalidUsername
  //   2 = InvalidUserPW
  //   3 = WrongUserPW
  //   4 = WrongServerPW
  //   5 = UsernameInUse
  //   6 = ServerFull
  //   7 = NoCertificate
  //   8 = AuthenticatorFail
  optional uint32 reject_type = 8;

  // 可选: 覆盖用户的初始频道
  optional uint32 channel_id = 9;

  // 可选: 要求客户端必须提供证书
  optional bool cert_required = 10;
}
