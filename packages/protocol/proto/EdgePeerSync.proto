syntax = "proto2";

package edgepeersync;

// ============================================================================
// Edge-to-Edge Session Sync Protocol
//
// Used on the /session WebSocket path (edge_port).  Each frame is a
// length-prefixed (4-byte big-endian) prost-encoded PeerSyncPacket.
// ============================================================================

// ─── Handshake ───────────────────────────────────────────────────────────────

// Sent by the connecting Edge immediately after WebSocket upgrade.
message EdgeSessionSyncRequest {
  // ID of the Edge requesting the snapshot.
  required uint32 requesting_edge_id = 1;
}

// Sent by the serving Edge in response to EdgeSessionSyncRequest.
message EdgeSessionSyncResponse {
  // The seq of the last delta already incorporated into this snapshot.
  // The receiver must apply buffered deltas with seq > seq_fence.
  required uint64 seq_fence = 1;
  // Full snapshot of all sessions currently owned by this Edge.
  repeated RemoteSessionProto sessions = 2;
}

// ─── Incremental updates ─────────────────────────────────────────────────────

// Streamed to all connected peers after the snapshot; exactly one event field
// must be populated per message.
message EdgeSessionDelta {
  // Edge that owns the session (always the sender).
  required uint32 source_edge_id = 1;
  // Monotonically increasing per-source sequence number.
  required uint64 seq = 2;
  // One of the four event types.
  optional RemoteSessionProto   user_joined = 3;
  optional SessionLeftEvent     user_left   = 4;
  // Full state snapshot after the change (receiver diffs against its cache).
  optional RemoteSessionProto   user_state  = 5;
  optional SessionMovedEvent    user_moved  = 6;
}

// A user has disconnected from the owning Edge.
message SessionLeftEvent {
  required uint32 session_id = 1;
}

// A user has moved to a different channel.
message SessionMovedEvent {
  required uint32 session_id = 1;
  required uint32 channel_id = 2;
}

// ─── Shared data types ───────────────────────────────────────────────────────

// Per-channel listening volume adjustment set by the client.
message ListeningVolumeAdjustment {
  required uint32 channel_id        = 1;
  // Multiplier: 0.0–10.0, default 1.0.
  required float  volume_adjustment = 2;
}

// Complete session state for a remotely-owned user.
// Mirrors ClientInfo but omits local-only fields (ip_address, connected_at, …).
message RemoteSessionProto {
  // ── Identity ──────────────────────────────────────────────────────────────
  required uint32 session_id = 1;
  required uint32 edge_id    = 2;
  required uint32 user_id    = 3;
  required string username   = 4;
  required uint32 channel_id = 5;
  optional string cert_hash  = 6;

  // ── ACL groups (set at login, static for session lifetime) ────────────────
  repeated string groups = 7;

  // ── Voice routing flags ───────────────────────────────────────────────────
  optional bool mute             = 10;
  optional bool deaf             = 11;
  optional bool suppress         = 12;
  optional bool self_mute        = 13;
  optional bool self_deaf        = 14;
  optional bool priority_speaker = 15;
  optional bool recording        = 16;

  // ── Channel listeners ─────────────────────────────────────────────────────
  repeated uint32 listening_channels = 17 [packed = false];

  // ── Mumble display fields ─────────────────────────────────────────────────
  optional bytes                       texture_hash                 = 20;
  optional bytes                       comment_hash                 = 21;
  repeated ListeningVolumeAdjustment   listening_volume_adjustments = 22;

  // ── Positional audio (reserved) ───────────────────────────────────────────
  optional bytes plugin_context = 30;
}

// ─── Frame wrapper ───────────────────────────────────────────────────────────

// Every binary WebSocket frame on /session is one PeerSyncPacket.
message PeerSyncPacket {
  // 1 = EdgeSessionSyncRequest
  // 2 = EdgeSessionSyncResponse
  // 3 = EdgeSessionDelta
  required uint32                   packet_type   = 1;
  optional EdgeSessionSyncRequest   sync_request  = 2;
  optional EdgeSessionSyncResponse  sync_response = 3;
  optional EdgeSessionDelta         delta         = 4;
}
