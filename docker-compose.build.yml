# Shared build file for munode-hub and munode-edge.
#
# Default workflows already work from the runtime compose files:
#   docker compose build
#   docker compose up -d --build
#
# Use this file only when you want to prebuild the role-specific images without
# bringing the runtime services into scope.
#
# Standalone usage (build only, no containers started):
#   docker compose -f docker-compose.build.yml build
#
# The builder services here stay out of the normal COMPOSE_FILE set, so they do
# not show up during a regular `docker compose up`.

x-build-common: &build-common
  context: .
  dockerfile: rust/Dockerfile
  cache_from:
    - type=local,src=.build-cache
  cache_to:
    - type=local,dest=.build-cache,mode=max

services:
  hub-builder:
    build:
      <<: *build-common
      target: hub-runtime
    image: ${MUNODE_HUB_IMAGE:-munode-hub:latest}
    command: ["false"]

  edge-builder:
    build:
      <<: *build-common
      target: edge-runtime
    image: ${MUNODE_EDGE_IMAGE:-munode-edge:latest}
    command: ["false"]
