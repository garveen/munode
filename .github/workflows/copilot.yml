name: Copilot Coding Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task for Copilot Coding Agent'
        required: true

jobs:
  copilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Install dependencies
        run: pnpm install
      - name: Run Copilot task
        run: echo "Copilot Coding Agent will execute the task here"