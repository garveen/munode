[package]
name = "munode-edge"
version.workspace = true
edition.workspace = true

[[bin]]
name = "munode-edge"
path = "src/main.rs"

[features]
## Enables test-only helpers (e.g. `test_route_to_edge`, `test_udp_drop_rate`).
## Required to compile the `voice_routing` integration test:
##   cargo test -p munode-edge --features test-utils --test voice_routing
test-utils = []

[dependencies]
munode-protocol = { workspace = true }
munode-common = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
prost = { workspace = true }
ring = { workspace = true }
aes = { workspace = true }
sha1 = { workspace = true }
hex = { workspace = true }
flate2 = { workspace = true }
arc-swap = { workspace = true }
dashmap = { workspace = true }
