[workspace]
members = [
    "munode-protocol",
    "munode-common",
    "munode-edge",
    "munode-hub",
    "munode-client",
    "munode-tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/garveen/munode"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Protobuf
prost = "0.13"
prost-build = "0.13"

# TLS
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
webpki-roots = "0.26"

# WebSocket (for Hub control channel)
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

# WebTransport / QUIC (optional — feature "webtransport" in munode-edge)
wtransport = { version = "0.7" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
maxminddb = "0.24"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
bytes = "1"
uuid = { version = "1", features = ["v4"] }
arc-swap = "1"
dashmap = "6"
nix = { version = "0.29", features = ["net", "socket", "uio"] }
smallvec = "1.13"
async-channel = "2"
regex = "1"
num_enum = "0.7"
tokio-util = { version = "0.7", features = ["rt"] }

# Crypto
ring = "0.17"
aes = "0.8"
argon2 = "0.5"
sha1 = "0.10"

# SQLite
rusqlite = { version = "0.33", features = ["bundled"] }
hex = "0.4"
base64 = "0.22"

# Compression
flate2 = "1"

# Embedded scripting
mlua = { version = "0.10", features = ["lua54", "send", "serialize", "vendored", "async"] }
# Web API
axum = { version = "0.7", features = [] }

# Workspace crates
munode-protocol = { path = "munode-protocol" }
munode-common = { path = "munode-common" }
