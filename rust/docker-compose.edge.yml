services:
  edge:
    build:
      context: ..
      dockerfile: rust/Dockerfile
    container_name: munode-edge
    restart: unless-stopped
    ports:
      - "${MUMBLE_PORT:-64738}:64738/tcp"
      - "${MUMBLE_PORT:-64738}:64738/udp"
      - "${EDGE_PORT:-64739}:64739/udp"
    volumes:
      - ${EDGE_CONFIG:-./config/edge.toml}:/app/config/edge.toml:ro
      - ${LOG_DIR:-./logs}/edge:/app/logs
    secrets:
      - tls_cert
      - tls_key
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - MUNODE_UID=${MUNODE_UID:-1000}
      - MUNODE_GID=${MUNODE_GID:-1000}
    networks:
      - munode-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "64738"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  munode-network:
    driver: bridge

secrets:
  tls_cert:
    file: ${TLS_CERT:-./certs/server.pem}
    uid: "${MUNODE_UID:-1000}"
    gid: "${MUNODE_GID:-1000}"
    mode: 0440
  tls_key:
    file: ${TLS_KEY:-./certs/server.key}
    uid: "${MUNODE_UID:-1000}"
    gid: "${MUNODE_GID:-1000}"
    mode: 0440
