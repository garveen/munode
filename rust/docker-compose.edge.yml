services:
  edge:
    build:
      context: ..
      dockerfile: rust/Dockerfile
      args:
        # Limit parallel compile jobs on low-memory / low-core machines.
        # Set e.g. CARGO_BUILD_JOBS=2 in your shell or .env before running
        # `docker compose build`. 0 (default) = use all available CPUs.
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-0}
      # Persistent layer cache stored on the host filesystem.
      # Unlike BuildKit's internal cache (--mount=type=cache), this directory
      # is a plain folder and is NOT cleaned by `docker system prune`.
      # Both edge and hub compose files point to the same .build-cache/ dir
      # so they share compiled dependency layers automatically.
      cache_from:
        - type=local,src=.build-cache
      cache_to:
        - type=local,dest=.build-cache,mode=max
    container_name: munode-edge
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    ports:
      - "${MUMBLE_PORT:-64738}:64738/tcp"
      - "${MUMBLE_PORT:-64738}:64738/udp"
      - "${EDGE_PORT:-64739}:64739/tcp"
      - "${EDGE_PORT:-64739}:64739/udp"
    volumes:
      - ${EDGE_CONFIG:-./config/edge.toml}:/app/config/edge.toml:ro
      - ${LOG_DIR:-./logs}/edge:/app/logs
    secrets:
      - tls_cert
      - tls_key
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - MUNODE_UID=${MUNODE_UID:-1000}
      - MUNODE_GID=${MUNODE_GID:-1000}
    networks:
      - munode-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "64738"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  munode-network:
    driver: bridge

secrets:
  tls_cert:
    file: ${TLS_CERT:-./certs/server.pem}
  tls_key:
    file: ${TLS_KEY:-./certs/server.key}
