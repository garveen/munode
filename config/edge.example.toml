# MuNode Edge Server – example configuration
# Copy this file to edge.toml and edit as needed.
#
# Docker Compose Usage:
#   1. Copy this file to edge.toml in the same directory
#   2. Update server_id (must be unique per edge)
#   3. Update hmac_secret to match Hub's registry.hmac_secret
#   4. Hub connects via 'hub:8443' within the Docker network
#   5. Mount TLS certificates to /app/certs/ volume

# Unique server ID for this edge (must be different for each edge in the cluster)
server_id = 1

# Human-readable server name (shown in logs and monitoring)
name = "MuNode Edge Server #1"

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_level  = "info"                    # trace | debug | info | warn | error
log_format = "text"                    # text (default, human-readable) | json (structured, for Loki/ELK)

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
[network]
host          = "0.0.0.0"              # Bind address for all services (default: 0.0.0.0)
port          = 64738                   # Main port for client connections (TCP/TLS + UDP, default: 64738)

# Edge-to-Edge TCP port (must differ from main port)
# If not set, defaults to port + 1
edge_port     = 64739                   # Default: port + 1

# External addresses for NAT/firewall scenarios
# Docker Compose: Set this to your public hostname/IP
# Other edge servers and Hub will use this address to reach this edge
external_host = "edge1.example.com"     # Public hostname/IP used by other edges and Hub (default: same as host)

# External port mapping for client connections (useful when behind NAT/firewall)
# If not set, uses the same value as 'port'
external_port = 64738                   # Default: same as port

# External edge-to-edge port mapping (if different from edge_port)
# If not set, uses the same value as 'edge_port'
# external_edge_port = 64739            # Default: same as edge_port

# Geographic region identifier (used for proximity-based routing)
# Used for proximity-based client assignment and routing optimization
region = "asia-east"                    # Default: not set (recommended to set for multi-region deployments)

# PROXY Protocol support (v1 and v2) for deployments behind nginx or HAProxy.
# When enabled, the real client IP is read from the PROXY Protocol header that
# the upstream proxy prepends to each connection.  All direct connections that
# do not carry a valid PROXY Protocol header will be rejected.
# Default: false (disabled)
#
# nginx example:
#   stream {
#     server {
#       listen 64738;
#       proxy_pass  backend_edge;
#       proxy_protocol on;
#     }
#   }
#
# HAProxy example:
#   frontend mumble
#     bind :64738
#     default_backend edge
#   backend edge
#     server edge1 127.0.0.1:64738 send-proxy-v2
#
# proxy_protocol = false

# ---------------------------------------------------------------------------
# TLS/SSL
# ---------------------------------------------------------------------------
[tls]
# Two deployment scenarios:
#
# 1. Docker Compose (recommended):
#    Secrets are injected via Docker secrets and mounted read-only inside the
#    container at /run/secrets/<name>. The entrypoint copies them to
#    /app/secrets/ with correct ownership so the unprivileged process can
#    read them.  Use the paths below as-is.
#      cert = "/app/secrets/tls_cert"
#      key  = "/app/secrets/tls_key"
#    Configure the source files in docker-compose.edge.yml (TLS_CERT / TLS_KEY
#    env vars), e.g.:
#      TLS_CERT=/etc/letsencrypt/live/example.com/fullchain.pem
#      TLS_KEY=/etc/letsencrypt/live/example.com/privkey.pem
#
# 2. Bare-metal / standalone:
#    Point directly to the certificate files on disk.
#      cert = "./certs/edge-cert.pem"
#      key  = "./certs/edge-key.pem"
#
cert = "/app/secrets/tls_cert"          # Docker: /app/secrets/tls_cert  |  Bare: ./certs/edge-cert.pem
key  = "/app/secrets/tls_key"           # Docker: /app/secrets/tls_key   |  Bare: ./certs/edge-key.pem
# ca = "./certs/ca-chain.pem"           # Optional: CA chain for client certificate validation

# ---------------------------------------------------------------------------
# Hub Server Connection
# ---------------------------------------------------------------------------
[hub_server]
# Docker Compose: Use container service name 'hub' for internal communication
# For standalone deployment, use the actual Hub hostname/IP
host               = "hub"              # Hub server hostname (Docker: 'hub', standalone: 'hub.example.com')
control_port       = 8443               # Hub's WebSocket control port (default: 8443)

# Reconnection and heartbeat settings
reconnect_interval = 5000               # Milliseconds between reconnection attempts (default: 5000)
heartbeat_interval = 10000              # Milliseconds between heartbeat packets (default: 10000)

# Number of concurrent WebSocket connections to Hub.
# Using 3 provides resilience against individual connection failures and improves
# throughput for clusters with many concurrent users.  Recommended for production.
pool_size = 3                           # Default: 1

# HMAC challenge-response authentication (must match Hub's registry.hmac_secret)
# If not set, edge authentication is disabled (Hub must allow unauthenticated edges)
hmac_secret = "change-me-to-match-hub-secret"  # Default: not set

# ---------------------------------------------------------------------------
# Server Capacity & Behavior
# ---------------------------------------------------------------------------
[server]
# Maximum number of concurrent client connections
capacity       = 1000                   # Default: 1000



# Test/debug flag: disable Hub relay for cross-edge voice (use direct UDP only)
# Used primarily for integration tests that verify Edge-to-Edge direct connections
# disable_hub_relay = false             # Default: false

# Maximum number of channels a single user may listen to simultaneously.
# 0 = unlimited.
# listeners_per_user    = 0            # Default: 0 (unlimited)

# Maximum number of listeners allowed in a single channel.
# 0 = unlimited.
# listeners_per_channel = 0            # Default: 0 (unlimited)

# Whether to respond to unauthenticated UDP ping probes from Mumble clients.
# Set to false to prevent the server from appearing in public server browsers.
# allow_ping = true                    # Default: true

# Rolling statistics window in seconds for per-user voice quality metrics.
# Controls how many seconds of OCB2 crypto stats are tracked per user.
# 0 = accumulate forever (not recommended for long-running servers).
# rolling_stats_window = 120           # Default: 120

# ---------------------------------------------------------------------------
# Voice Routing
# ---------------------------------------------------------------------------
[voice_routing]
# Enable cross-edge voice routing (relay and direct UDP)
enabled = true                                # Default: true

# Use Hub TCP relay as last resort when all other paths fail
enable_hub_tcp_fallback = true                # Default: true

# Consecutive UDP send failures before skipping a next-hop (0 = disabled)
consecutive_failure_threshold = 2             # Default: 2

[voice_routing.relay]
# Enable Hub-mediated voice relay
enabled            = true              # Default: true
# Maximum total relay bandwidth across all streams (kbps, 0 = unlimited)
max_relay_bandwidth = 0                # Default: 0 (unlimited)

# ---------------------------------------------------------------------------
# Web API
# ---------------------------------------------------------------------------
[web_api]
# Enable the HTTP Web API for local monitoring (GET /api/clients, GET /api/health).
# Bind to 127.0.0.1 (or a private interface) — this endpoint has no authentication.
enabled = false                        # Default: false
host    = "127.0.0.1"                  # Default: 127.0.0.1
port    = 8081                         # Default: 8081

