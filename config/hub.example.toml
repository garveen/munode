# MuNode Hub Server – example configuration
# Copy this file to hub.toml and edit as needed.
#
# Docker Compose Usage:
#   1. Copy this file to hub.toml in the same directory
#   2. Update hmac_secret and auth settings
#   3. Edge servers connect to 'hub:8443' within the Docker network

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_level  = "info"                    # trace | debug | info | warn | error
log_format = "text"                    # text (default, human-readable) | json (structured, for Loki/ELK)

# Note: Log output goes to stdout/stderr and should be captured by your
# process manager (Docker, systemd, etc.). No log file configuration needed.

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
[network]
host         = "0.0.0.0"            # Bind address (default: 0.0.0.0)
control_port = 8443                  # Edge nodes connect to this WebSocket port (default: 8443)

# Optional: start a second WS listener for external auth services
# This allows TypeScript auth service instances to connect via WebSocket
# auth_service_port = 64739          # Default: not set (auth service WS disabled)

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
[database]
# Docker Compose: this path is relative to /app/ in the container
# The ./data directory should be mounted as a volume
path = "./data/hub.sqlite"           # SQLite database file path (default: data/munode.db)

# ---------------------------------------------------------------------------
# Registry (Edge authentication)
# ---------------------------------------------------------------------------
[registry]
# HMAC secret for edge server authentication challenge-response
# If not set, edge authentication is disabled (less secure)
hmac_secret       = "change-me-to-a-random-secret"  # Default: not set

# Heartbeat timeout: if no heartbeat received from edge within this time, mark as dead
heartbeat_timeout = 30000            # Milliseconds (default: 30000)

# ---------------------------------------------------------------------------
# Authentication
#
# Priority order (first match wins):
#   1. External WebSocket auth service  (auth_service_port must be set)
#   2. Lua script                       (auth.lua_script)
#   3. HTTP URL                         (auth.http_url)
#   4. Local SQLite database
#
# Set require_auth_service = true to hard-fail if none of the above external
# methods are reachable (prevents silent fallback to local DB).
# ---------------------------------------------------------------------------
[auth]
# Allow guests/anonymous users to connect without authentication
allow_guest    = true                # Default: true

# Default channel ID for newly connected users
default_channel = 0                  # Default: 0 (root channel)

# Server-wide password: all users must provide this password to connect
# server_password = "optional-server-wide-password"  # Default: not set

# When true, require external auth service to be available (no fallback to local DB)
# When false, fall back to local database authentication if external service fails
require_auth_service = false         # Default: false

# HTTP timeout for external authentication requests
http_timeout_ms = 5000               # Milliseconds (default: 5000)

# ---------------------------------------------------------------------------
# Authentication Methods
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Option A: Lua inline script (most flexible, recommended for complex logic)
#
# The script is written inside a TOML literal multi-line string (''' ... ''').
# No escaping is needed – write the Lua code exactly as you would in a file.
#
# Injected globals:
#   http_post(url, body_table [, headers_table])
#       -> { status = number, ok = boolean, json = table|nil, body = string|nil }
#
# authenticate(req) must return:
#   Success: { success=true,  user_id=N,   username="...", display_name="...", groups={...} }
#   Failure: { success=false, reason="...", reject_type=N }
#            reject_type: 3=WrongUserPW  4=WrongServerPW  5=NoCertificate  8=AuthenticatorFail
#
# req fields available:
#   username, password, session_id, tokens (array), server_id,
#   ip, ip_version, release, version (integer|nil), os, osversion,
#   certificate_hash (string|nil)
# ---------------------------------------------------------------------------
lua_script = '''
-- Persistent state: HTTP headers shared across all calls (set once, reused).
local AUTH_URL   = "https://example.com/mumble-connector/api/authenticate"
local AUTH_TOKEN = "replace-with-your-api-token"

function authenticate(req)
  local res = http_post(
    AUTH_URL,
    {
      username         = req.username,
      password         = req.password,
      session_id       = req.session_id,
      tokens           = req.tokens,
      server_id        = req.server_id,
      ip               = req.ip,
      ip_version       = req.ip_version,
      release          = req.release,
      version          = req.version,
      os               = req.os,
      osversion        = req.osversion,
      certificate_hash = req.certificate_hash,
    },
    {
      ["Content-Type"] = "application/json",
      ["accept"]       = "application/json",
      ["X-Token"]      = AUTH_TOKEN,
    }
  )

  -- HTTP-level failure
  if not res.ok then
    return {
      success     = false,
      reason      = "Authentication service unavailable (HTTP " .. tostring(res.status) .. ")",
      reject_type = 8,  -- AuthenticatorFail
    }
  end

  local body = res.json

  -- Application-level success (adapt field names to your API)
  if body.status == 0 then
    return {
      success      = true,
      user_id      = body.user_id,
      username     = body.nickname,
      display_name = body.nickname,
      groups       = body.groups,
    }
  else
    return {
      success     = false,
      reason      = body.reason or "Authentication denied",
      reject_type = 3,  -- WrongUserPW
    }
  end
end
'''

# ---------------------------------------------------------------------------
# Option B: HTTP Webhook (simpler, no scripting required)
# Comment out lua_script above and uncomment these lines.
# The Hub will POST authentication requests to this URL and expect JSON response.
# ---------------------------------------------------------------------------
# http_url        = "https://example.com/mumble-connector/api/authenticate"
# http_timeout_ms = 5000               # HTTP request timeout in milliseconds (default: 5000)

# ---------------------------------------------------------------------------
# Option C: Local SQLite Database (fallback)
# If no external auth method is configured, the Hub will use local database.
# Users can be managed via SQL queries to the database file.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Server Limits (applied Hub-wide)
# All values in this section are pushed to Edge nodes at registration time
# and override any local fallback values configured on the Edge.
# ---------------------------------------------------------------------------
[limits]
# Maximum total users across all edges (0 = unlimited)
max_users            = 1000            # Default: 1000

# Maximum users per channel (0 = unlimited)
max_users_per_channel = 0              # Default: 0 (unlimited)

# Maximum length of a text message in bytes (0 = unlimited)
text_message_length  = 5000            # Default: 5000

# Maximum length of an image message in bytes (0 = unlimited)
image_message_length = 131072          # Default: 131072 (128 KB)

# Maximum length of a plugin data message in bytes (0 = unlimited)
plugin_message_length = 1024           # Default: 1024

# Token-bucket rate limiter for control-plane messages (TextMessage,
# UserState, ChannelState, ContextAction, UserStats).  Mirrors Murmur's
# `messagelimit` / `messageburst`.
message_rate  = 1.0                    # Default: 1.0 msg/s (Murmur default)

# Token-bucket burst size for control-plane messages
message_burst = 5                      # Default: 5

# Maximum bandwidth per user in bits per second (pushed to clients via ServerConfig)
max_bandwidth = 558000                 # Default: 558000 (bps, ~558 kbps)

# Welcome message (MOTD) displayed to all connecting clients (0 = use server default)
# welcome_text = "Welcome to MuNode!"  # Default: not set

# Maximum listeners per user (0 = unlimited)
listeners_per_user    = 0              # Default: 0 (unlimited)

# Maximum listeners per channel (0 = unlimited)
listeners_per_channel = 0             # Default: 0 (unlimited)

# Maximum simultaneous sessions per non-anonymous user (0 = unlimited).
# When the limit is reached, the oldest session for that user is kicked to make
# room for the new connection. Anonymous users (no registered account) are not
# affected by this setting.
max_sessions_per_user = 1             # Default: 1

# ---------------------------------------------------------------------------
# Auto-Ban (brute-force protection)
# ---------------------------------------------------------------------------
[auto_ban]
# Enable automatic IP-based banning after repeated authentication failures
enabled     = false                    # Default: false

# Number of failed attempts before an IP is banned
attempts    = 10                       # Default: 10

# Time window in seconds for counting failures
time_window = 120                      # Default: 120 seconds

# Ban duration in seconds
duration    = 300                      # Default: 300 seconds (5 minutes)

# ---------------------------------------------------------------------------
# Client Suggestions
# Optional: send recommended settings to connecting Mumble clients.
# ---------------------------------------------------------------------------
# [suggest]
# version      = "1.3.4"              # Suggested minimum client version (string, e.g. "1.3.4")
#                                      # Encoded as v1 (major<<16|minor<<8|patch) and v2 (major<<48|minor<<32|patch<<16)
# positional   = false                 # Suggest enabling positional audio
# push_to_talk = false                 # Suggest enabling push-to-talk

# ---------------------------------------------------------------------------
# Validation Rules
# ---------------------------------------------------------------------------
[validation]
# Optional regex patterns to validate usernames and channel names
# If set, names not matching the pattern will be rejected
# username_regex     = "^[a-zA-Z0-9_]{3,32}$"  # Example: alphanumeric, 3-32 chars
# channel_name_regex = "^[^\\x00-\\x1f]{1,64}$" # Example: no control chars, max 64 chars

# ---------------------------------------------------------------------------
# Web API
# ---------------------------------------------------------------------------
[web_api]
# Enable the HTTP management API (metrics, ban management, etc.)
enabled = false                         # Default: false

# Bind host for the Web API server, if it's in docker, must be 0.0.0.0
host    = "0.0.0.0"                    # Default: 0.0.0.0

# Port for the Web API server
port    = 8080                         # Default: 8080

# Optional API key for write operations (POST, PUT, DELETE).
# If not set, write endpoints (e.g. DELETE /api/bans/:id) are rejected with 403.
# Set a strong random secret here to secure the management API.
# api_key = "change-me-to-a-random-secret"  # Default: not set
#
# Available endpoints:
#   GET  /api/health        – liveness probe
#   GET  /api/status        – hub runtime status
#   GET  /api/edges         – connected edge summary
#   GET  /api/topology      – observed topology and link quality
#   GET  /api/dissemination – authoritative per-edge dissemination views
#   GET  /api/voice_targets – cluster-wide voice target snapshot
#   GET  /api/clients       – active client sessions across the cluster
#   GET  /metrics           – Prometheus metrics
#   GET  /api/bans          – list active and expired bans
#   DELETE /api/bans/:id    – remove a specific ban

# ---------------------------------------------------------------------------
# Blob Store (textures, user comments)
# ---------------------------------------------------------------------------
[blob_store]
# Directory for storing user avatar textures and channel/user comments
# Docker Compose: mount this directory as a volume for persistence
path = "./data/blobs"                  # Default: data/blobs

# ---------------------------------------------------------------------------
# Voice Routing Policy
# ---------------------------------------------------------------------------
[voice_routing]
# Enable Hub-mediated TCP voice relay for cross-edge routing
enable_hub_tcp_relay         = true    # Default: true

# Maximum simultaneous relay streams between any pair of edges
max_relay_streams_per_pair   = 0       # Default: 0 (unlimited)

# Maximum total relay streams across the whole cluster
max_total_relay_streams      = 0       # Default: 0 (unlimited)

# Cost multiplier applied to relay routes during path selection
# (higher = relay is considered more expensive, direct preferred)
relay_cost_factor            = 1.2     # Default: 1.2

# RTT threshold (ms): prefer relay over direct when direct RTT exceeds this value
direct_rtt_threshold         = 200     # Default: 200 ms

# Packet-loss threshold: prefer relay when direct loss rate exceeds this value
direct_loss_threshold        = 0.05    # Default: 0.05 (5%)

# Cluster-wide TTL cap for relay packets pushed to every Edge in routeTableUpdate.
# Edges will not forward relay packets whose TTL reaches zero.
max_ttl                      = 4       # Default: 4 hops

# ---------------------------------------------------------------------------
# Channel Ninja (invisible channels)
# ---------------------------------------------------------------------------
[channel_ninja]
# When enabled, users who lack both Enter AND Listen permission on a ninja channel
# will not see that channel's occupants at all (the privileged users appear offline).
enabled        = false                 # Default: false

# List of channel IDs to treat as ninja channels
# Example: ninja_channels = [5, 12, 23]
ninja_channels = []                    # Default: [] (no ninja channels)

# ---------------------------------------------------------------------------
# GeoIP (optional geographic lookup)
# ---------------------------------------------------------------------------
[geoip]
# Path to a MaxMind GeoLite2-City.mmdb or GeoLite2-Country.mmdb file.
# Download from: https://dev.maxmind.com/geoip/geolite2-free-geolocation-data
# Leave empty to disable GeoIP lookups.
database_path = ""                     # Default: "" (disabled)

# Log geographic location (country, city) for each connecting user
log_location  = true                   # Default: true

