# MuNode Hub Server – example configuration
# Copy this file to hub.toml and edit as needed.
#
# Docker Compose Usage:
#   1. Copy this file to hub.toml in the same directory
#   2. Update hmac_secret and auth settings
#   3. Edge servers connect to 'hub:8443' within the Docker network

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
[network]
host         = "0.0.0.0"            # Bind address (default: 0.0.0.0)
control_port = 8443                  # Edge nodes connect to this WebSocket port (default: 8443)

# Optional: start a second WS listener for external auth services
# This allows TypeScript auth service instances to connect via WebSocket
# auth_service_port = 64739          # Default: not set (auth service WS disabled)

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
[database]
# Docker Compose: this path is relative to /app/ in the container
# The ./data directory should be mounted as a volume
path = "./data/hub.sqlite"           # SQLite database file path (default: data/munode.db)

# ---------------------------------------------------------------------------
# Registry (Edge authentication)
# ---------------------------------------------------------------------------
[registry]
# HMAC secret for edge server authentication challenge-response
# If not set, edge authentication is disabled (less secure)
hmac_secret       = "change-me-to-a-random-secret"  # Default: not set

# Heartbeat timeout: if no heartbeat received from edge within this time, mark as dead
heartbeat_timeout = 90000            # Milliseconds (default: 90000)

# ---------------------------------------------------------------------------
# Authentication
#
# Priority order (first match wins):
#   1. External WebSocket auth service  (auth_service_port must be set)
#   2. Lua script                       (auth.lua_script)
#   3. HTTP URL                         (auth.http_url)
#   4. Local SQLite database
#
# Set require_auth_service = true to hard-fail if none of the above external
# methods are reachable (prevents silent fallback to local DB).
# ---------------------------------------------------------------------------
[auth]
# Allow guests/anonymous users to connect without authentication
allow_guest    = true                # Default: true

# Default channel ID for newly connected users
default_channel = 0                  # Default: 0 (root channel)

# Welcome message displayed to all connecting clients
# welcome_text = "Welcome to the server!"  # Default: not set

# Server-wide password: all users must provide this password to connect
# server_password = "optional-server-wide-password"  # Default: not set

# When true, require external auth service to be available (no fallback to local DB)
# When false, fall back to local database authentication if external service fails
require_auth_service = false         # Default: false

# HTTP timeout for external authentication requests
http_timeout_ms = 5000               # Milliseconds (default: 5000)

# ---------------------------------------------------------------------------
# Authentication Methods
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Option A: Lua inline script (most flexible, recommended for complex logic)
#
# The script is written inside a TOML literal multi-line string (''' ... ''').
# No escaping is needed – write the Lua code exactly as you would in a file.
#
# Injected globals:
#   http_post(url, body_table [, headers_table])
#       -> { status = number, ok = boolean, json = table|nil, body = string|nil }
#
# authenticate(req) must return:
#   Success: { success=true,  user_id=N,   username="...", display_name="...", groups={...} }
#   Failure: { success=false, reason="...", reject_type=N }
#            reject_type: 3=WrongUserPW  4=WrongServerPW  5=NoCertificate  8=AuthenticatorFail
#
# req fields available:
#   username, password, session_id, tokens (array), server_id,
#   ip, ip_version, release, version (integer|nil), os, osversion,
#   certificate_hash (string|nil)
# ---------------------------------------------------------------------------
lua_script = '''
-- Persistent state: HTTP headers shared across all calls (set once, reused).
local AUTH_URL   = "https://example.com/mumble-connector/api/authenticate"
local AUTH_TOKEN = "replace-with-your-api-token"

function authenticate(req)
  local res = http_post(
    AUTH_URL,
    {
      username         = req.username,
      password         = req.password,
      session_id       = req.session_id,
      tokens           = req.tokens,
      server_id        = req.server_id,
      ip               = req.ip,
      ip_version       = req.ip_version,
      release          = req.release,
      version          = req.version,
      os               = req.os,
      osversion        = req.osversion,
      certificate_hash = req.certificate_hash,
    },
    {
      ["Content-Type"] = "application/json",
      ["accept"]       = "application/json",
      ["X-Token"]      = AUTH_TOKEN,
    }
  )

  -- HTTP-level failure
  if not res.ok then
    return {
      success     = false,
      reason      = "Authentication service unavailable (HTTP " .. tostring(res.status) .. ")",
      reject_type = 8,  -- AuthenticatorFail
    }
  end

  local body = res.json

  -- Application-level success (adapt field names to your API)
  if body.status == 0 then
    return {
      success      = true,
      user_id      = body.user_id,
      username     = body.nickname,
      display_name = body.nickname,
      groups       = body.groups,
    }
  else
    return {
      success     = false,
      reason      = body.reason or "Authentication denied",
      reject_type = 3,  -- WrongUserPW
    }
  end
end
'''

# ---------------------------------------------------------------------------
# Option B: HTTP Webhook (simpler, no scripting required)
# Comment out lua_script above and uncomment these lines.
# The Hub will POST authentication requests to this URL and expect JSON response.
# ---------------------------------------------------------------------------
# http_url        = "https://example.com/mumble-connector/api/authenticate"
# http_timeout_ms = 5000               # HTTP request timeout in milliseconds (default: 5000)

# ---------------------------------------------------------------------------
# Option C: Local SQLite Database (fallback)
# If no external auth method is configured, the Hub will use local database.
# Users can be managed via SQL queries to the database file.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_level = "info"                      # trace | debug | info | warn | error

# Note: Log output goes to stdout/stderr and should be captured by your
# process manager (Docker, systemd, etc.). No log file configuration needed.
